<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Website</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #0d1530;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 7vw, 42px);
      font-weight: 600;
      color: #c9a449;
      text-align: center;
      letter-spacing: 0.01em;
      line-height: 1.2;
      text-shadow: 0 2px 16px rgba(201, 164, 73, 0.25);
    }
    .divider {
      width: 48px;
      height: 2px;
      background: rgba(201, 164, 73, 0.4);
      border-radius: 999px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      margin-top: 8px;
    }
    a.btn {
      display: block;
      width: 100%;
      background: #c9a449;
      color: #0d1530;
      font-family: 'DM Sans', -apple-system, sans-serif;
      font-weight: 700;
      font-size: clamp(15px, 4vw, 18px);
      padding: 18px 32px;
      border-radius: 999px;
      text-decoration: none;
      letter-spacing: 0.04em;
      text-align: center;
      box-shadow: 0 8px 32px rgba(201, 164, 73, 0.35), 0 2px 8px rgba(0, 0, 0, 0.4);
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.1s ease;
      -webkit-tap-highlight-color: transparent;
    }
    a.btn.outline {
      background: transparent;
      color: #c9a449;
      border: 2px solid rgba(201, 164, 73, 0.6);
      box-shadow: 0 4px 20px rgba(201, 164, 73, 0.12), 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    a.btn:hover {
      background: #e0bb66;
      color: #0d1530;
      box-shadow: 0 12px 40px rgba(201, 164, 73, 0.45), 0 4px 12px rgba(0, 0, 0, 0.4);
      transform: scale(1.02);
    }
    a.btn.outline:hover {
      background: rgba(201, 164, 73, 0.12);
      color: #e0bb66;
    }
    a.btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container">
    <h1>The New and Improved Daily Faith</h1>
    <div class="divider"></div>
    <div class="btn-group">
      <a class="btn" href="https://YOUR-LINK-HERE.com" target="_blank" rel="noopener">
        Click for new website
      </a>
      <a class="btn outline" href="https://YOUR-TUTORIAL-LINK-HERE.com" target="_blank" rel="noopener">
        Click for tutorial
      </a>
    </div>
  </div>
</body>
</html>
